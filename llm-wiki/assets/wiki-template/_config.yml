title: __TOPIC__
description: __TOPIC__ — an LLM-maintained wiki
theme: just-the-docs
source: docs

url: https://__GITHUB_OWNER__.github.io
baseurl: /__GITHUB_REPO__

permalink: pretty
heading_anchors: true
search_enabled: true
color_scheme: light

aux_links:
  GitHub:
    - https://github.com/__GITHUB_OWNER__/__GITHUB_REPO__

gh_edit_link: true
gh_edit_link_text: Source on GitHub
gh_edit_repository: https://github.com/__GITHUB_OWNER__/__GITHUB_REPO__
gh_edit_branch: main
gh_edit_source: docs
gh_edit_view_mode: tree

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

defaults:
  - scope:
      path: ""
    values:
      layout: default
